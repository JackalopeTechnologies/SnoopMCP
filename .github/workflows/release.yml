name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v1.1.0 && git push origin v1.1.0
# The tag (minus the leading 'v') becomes the MSI ProductVersion.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout (with submodules + LFS)
        uses: actions/checkout@v7
        with:
          # external/snoopwpf is a submodule the native injector builds from.
          submodules: recursive
          # GitVersion (used by snoopwpf's Snoop.InjectorLauncher) needs full history; a shallow
          # clone fails with "Repository is a shallow clone" when the installer builds the injector.
          # Mirrors the same fix in ci.yml.
          fetch-depth: 0
          # icon.ico and other binary assets are stored in Git LFS; without this the MSI would embed
          # LFS pointer files instead of the real binaries.
          lfs: true

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install WiX toolset and extensions
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}' -replace '^v', ''
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release version: $v"

      - name: Build installer (MSI)
        shell: pwsh
        run: ./SnoopMCP.Installer/build-installer.ps1 -Version ${{ steps.ver.outputs.version }} -Configuration Release

      - name: Rename MSI with version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = 'SnoopMCP.Installer/SnoopMCP.msi'
          if (-not (Test-Path $msi)) { throw "Installer build did not produce $msi" }
          Copy-Item $msi "SnoopMCP.Installer/SnoopMCP-${{ steps.ver.outputs.version }}.msi"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SnoopMCP ${{ steps.ver.outputs.version }}
          files: SnoopMCP.Installer/SnoopMCP-${{ steps.ver.outputs.version }}.msi
          generate_release_notes: true
          draft: false
          prerelease: false
