name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v1.1.0 && git push origin v1.1.0
# The tag (minus the leading 'v') becomes the MSI ProductVersion.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          # external/snoopwpf is a submodule the native injector builds from.
          submodules: recursive

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install WiX toolset and extensions
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}' -replace '^v', ''
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release version: $v"

      - name: Build installer (MSI)
        shell: pwsh
        run: ./SnoopMCP.Installer/build-installer.ps1 -Version ${{ steps.ver.outputs.version }} -Configuration Release

      - name: Rename MSI with version
        shell: pwsh
        run: Copy-Item SnoopMCP.Installer/SnoopMCP.msi "SnoopMCP.Installer/SnoopMCP-${{ steps.ver.outputs.version }}.msi"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SnoopMCP ${{ steps.ver.outputs.version }}
          files: SnoopMCP.Installer/SnoopMCP-${{ steps.ver.outputs.version }}.msi
          generate_release_notes: true
          draft: false
          prerelease: false
