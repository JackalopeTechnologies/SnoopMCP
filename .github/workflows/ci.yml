name: CI

# Runs on every PR and on pushes to master. The job is named "build" to satisfy the required
# "build" status check in master's branch protection.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout (with submodules + LFS)
        uses: actions/checkout@v7
        with:
          # external/snoopwpf is a submodule the native injector builds from.
          submodules: recursive
          # GitVersion (used by snoopwpf's Snoop.InjectorLauncher) needs full history: a shallow
          # clone fails with "Repository is a shallow clone", which surfaces on pull_request merge
          # refs even though master's push builds tolerate the default shallow checkout.
          fetch-depth: 0
          # icon.ico (and other binary assets) are stored in Git LFS; without this the checkout
          # leaves LFS pointer files and the exe-icon embedding (csc /win32icon) fails CS7065.
          lfs: true

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        # DisableGitVersionTask: the vendored snoopwpf Snoop.InjectorLauncher pulls GitVersion.MsBuild
        # (repo-wide via snoopwpf's Directory.Build.props), which fails on detached CI checkouts -
        # notably tag builds, where it can't guess a branch. SnoopMCP never uses the launcher's
        # version, so disable the task. An env var (not -p:) is used so it reaches the launcher's
        # nested x64/ARM64 MSBuild self-invocations too.
        env:
          DisableGitVersionTask: 'true'
        # -nodeReuse:false: never adopt a persistent MSBuild node whose duplicate-cased PATH
        # otherwise crashes the nested native (CL.exe) build. TreatWarningsAsErrors is on via
        # Directory.Build.props.
        run: dotnet build SnoopMCP.sln -m:2 -nodeReuse:false

      - name: Test
        # Excludes the injection end-to-end test, which needs a live GUI target + injection and is
        # not reliable on a CI runner.
        run: dotnet test SnoopMCP.sln --no-build -c Debug -m:2 --filter "FullyQualifiedName!~EndToEndTests" -- xUnit.MaxParallelThreads=4

  installer-qualification:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [lifecycle, host]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Prepare installer tools
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }
          wix extension add -g WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX Util extension installation failed.' }
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX UI extension installation failed.' }
      - name: Build candidate MSI
        shell: pwsh
        env:
          DisableGitVersionTask: 'true'
        run: ./SnoopMCP.Installer/build-installer.ps1 -Version 1.4.3 -Configuration Release
      - name: Verify installed scheduled host
        if: matrix.check == 'host'
        shell: pwsh
        run: ./SnoopMCP.Installer/Test-InstalledHost.ps1 -PackagePath ./SnoopMCP.Installer/SnoopMCP.msi -EvidenceDirectory ./artifacts/installer-qualification
      - name: Verify installer lifecycle and interrupted upgrades
        if: matrix.check == 'lifecycle'
        shell: pwsh
        run: ./SnoopMCP.Installer/Test-InstallerLifecycle.ps1 -PackagePath ./SnoopMCP.Installer/SnoopMCP.msi -EvidenceDirectory ./artifacts/installer-qualification
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-qualification-${{ matrix.check }}
          path: artifacts/installer-qualification
          if-no-files-found: error
